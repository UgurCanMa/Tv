name: App bauen

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/app.yml'
      - '.github/app-test.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Testen und bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Fehler melden
        if: failure()
        working-directory: android
        run: |
          grep -E '^e: |error:|What went wrong|Could not |FAILED|Exception' build.log | head -40 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error::${line}"
          done
          exit 1

      - name: APK veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk UgurTV.apk
          TITLE="Ugur TV – App (Version 1.${{ github.run_number }})"
          NOTES="Android-App für die Senderliste. Auf dem Handy herunterladen und installieren."
          if gh release view app >/dev/null 2>&1; then
            gh release upload app UgurTV.apk --clobber
            gh release edit app --title "$TITLE" --notes "$NOTES"
          else
            gh release create app UgurTV.apk --title "$TITLE" --notes "$NOTES" --latest
          fi

  testen:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app -p UgurTV.apk

      - name: Im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/app-test.sh

      - name: Screenshots speichern
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b screenshots
          git add -A
          git commit -q -m "Screenshots Lauf ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
